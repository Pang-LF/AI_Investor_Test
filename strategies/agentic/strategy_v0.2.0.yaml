strategy_id: agentic_single_account
version: strategy_v0.2.0
effective_date: 2026-09-10
owner: system_and_user
objective:
  target_value_usd: 100000
  maximum_horizon_years: 5
  capital_plan:
    initial_usd: 1000
    month_1_usd: 1000
    month_2_usd: 1000
  note: Target is aspirational, not a guaranteed return or an optimizer constraint.

universe:
  size: 60
  fixed_market_and_sector_etfs: 12
  stable_liquid_core_slots: 33
  event_slots: 10
  position_reserve_slots: 5
  core_ranking_inputs:
    - liquidity
    - market_cap
    - data_completeness
  core_ranking_excludes:
    - recent_return

signals:
  model: pooled_ridge_v0.1.0
  horizons_days: [5, 20]
  families:
    - residual_trend_20d_60d
    - price_volume_event
    - residual_reversal_1d_5d
  safeguards:
    - prior_completed_daily_bars_only
    - time_ordered_validation
    - ridge_regularization
    - forecast_shrinkage
    - forecast_cap

research_gate:
  model: gpt-5.6-luna
  calls_per_decision: 1
  role: qualitative_veto_or_allow_only
  cannot_set:
    - forecast
    - position_size
    - order
    - hard_risk_policy
  required_outputs:
    - concise_rationale
    - bull_case
    - bear_case
    - falsification

portfolio:
  method: long_only_projected_mean_variance
  covariance: off_diagonal_shrinkage
  cash_is_allowed: true
  no_trade_is_allowed: true

change_log:
  - changed_at: 2026-09-10
    changed_by: user
    reason: Permit concentrated/opportunistic deployment for the five-year objective.
    changes:
      - single_position_cap_20_to_100_percent
      - single_trade_cap_200_usd_to_100_percent_of_nav
      - daily_turnover_cap_20_to_100_percent
      - maximum_positions_5_to_10
  - changed_at: 2026-09-10
    changed_by: system
    reason: Separate observation-universe construction from alpha generation.
    changes:
      - removed_same_day_return_from_core_ranking
