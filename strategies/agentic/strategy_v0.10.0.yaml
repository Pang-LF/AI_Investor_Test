strategy_id: agentic_single_account
version: strategy_v0.10.0
effective_date: 2026-09-16
owner: system_and_user
supersedes: strategy_v0.9.0

objective:
  target_value_usd: 100000
  maximum_horizon_years: 5
  note: The target is aspirational and never forces a trade.

live_engine:
  model: pooled_beta_ridge_v0.5.0
  new_entry_live_enabled: true
  existing_position_management_enabled: true
  broad_daily_research_universe_size: 200
  quantitative_shortlist_size: 25
  maximum_fresh_llm_symbols_per_run: 5
  portfolio_optimizer_access: true
  order_generation_access: true

factor_rank_challenger:
  version: cross_sectional_factor_rank_v0.1
  enabled: true
  status: shadow_only
  live_entry_enabled: false
  portfolio_optimizer_access: false
  order_generation_access: false
  universe: same_200_stock_completed_daily_bar_universe
  point_in_time_only: true
  winsor_percentiles: [0.01, 0.99]
  final_transform: cross_sectional_percentile_rank
  shortlist_size: 25
  factor_components:
    residual_trend:
      family: trend
      direction: higher_is_better
    breakout_channel:
      family: trend
      direction: higher_is_better
    reversal_5d:
      family: reversal
      direction: recent_residual_underperformance_is_better
    relative_volume_confirmation:
      family: volume
      direction: confirms_signed_price_direction
    obv_confirmation:
      family: volume
      direction: higher_is_better
    low_downside_volatility:
      family: risk
      direction: lower_downside_volatility_is_better
    low_drawdown_pressure:
      family: risk
      direction: shallower_drawdown_is_better
  family_weighting:
    trend: 0.25
    reversal: 0.25
    volume: 0.25
    risk: 0.25
  factor_direction_may_flip_from_recent_results: false
  diagnostics:
    - ridge_rank_alongside_composite_rank
    - pairwise_family_spearman
    - pairwise_family_top_bucket_overlap
    - top_25_overlap_with_ridge
    - 5d_10d_20d_rank_ic
    - family_rank_ic
    - rank_bucket_excess_returns
    - top_25_turnover
  persistence:
    unique_key: engine_version_formation_date_symbol
    repeated_intraday_snapshots_count_as_new_sample: false
    forward_returns: excess_over_spy

event_engine:
  version: empirical_event_analog_v0.1
  enabled: true
  live_entry_enabled: false

portfolio:
  maximum_invested_fraction: 1.0
  strategy_soft_position_fraction: 1.0
  strategy_soft_sector_fraction: 1.0

hard_risk_policy:
  reference: hard_risk_v1.3
  independently_enforced: true
  changed_in_this_strategy_version: false

change_log:
  - changed_at: 2026-09-16
    changed_by: user_and_system
    reason: Add a rank-based challenger without changing LIVE portfolio decisions.
    changes:
      - add_point_in_time_cross_sectional_factor_snapshot
      - winsorize_then_percentile_rank_each_component
      - equal_weight_four_independent_factor_families
      - persist_ridge_and_challenger_ranks_side_by_side
      - resolve_5d_10d_20d_forward_excess_returns
      - report_rank_ic_bucket_monotonicity_overlap_and_turnover
      - enforce_challenger_shadow_only_in_configuration_code
