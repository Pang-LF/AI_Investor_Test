[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-investor-test"
version = "0.8.0"
description = "A safety-gated autonomous Robinhood Agentic investing system."
requires-python = ">=3.9"
dependencies = [
  "httpx>=0.27,<1",
  "keyring>=25,<26",
  "openai>=2,<3",
  "tomli>=2,<3; python_version < '3.11'",
]

[project.scripts]
ai-investor = "ai_investor.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
