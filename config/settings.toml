mode = "LIVE"
live_trading = true
strategy_version = "strategy_v0.2.0"
prompt_version = "research_v0.1.0"
openai_model = "gpt-5.6-luna"
max_input_tokens = 12000
max_output_tokens = 1200
max_llm_calls_per_run = 1
max_tool_calls_per_run = 4
max_mcp_calls_per_decision_run = 50
max_estimated_cost_per_run_usd = 0.05
max_monthly_llm_budget_usd = 2.50

[monitor]
interval_minutes = 15
universe_size = 60
quote_batch_size = 20
max_mcp_calls_per_cycle = 8
quote_batch_delay_seconds = 1.0
max_quote_age_minutes = 30
market_timezone = "America/New_York"
core_target = 33
event_target = 10
position_reserve = 5
core_min_price = 10.0
core_min_market_cap = 5000000000
core_min_average_volume = 1000000
core_min_average_dollar_volume = 100000000
event_min_market_cap = 1000000000
event_min_average_volume = 500000
event_min_relative_volume = 1.25
event_min_absolute_change = 0.02
general_move_trigger = 0.02
position_move_trigger = 0.01
fixed_etfs = [
  "SPY", "QQQ", "IWM", "RSP",
  "XLK", "XLF", "XLV", "XLY",
  "XLP", "XLI", "XLE", "XLU",
]

[forecast]
history_calendar_days = 240
min_history_bars = 100
ridge_penalty = 8.0
min_training_samples = 500
shrinkage = 0.35
candidate_count = 3
min_probability_positive = 0.55
min_expected_excess_return_20d = 0.005
max_abs_forecast_20d = 0.08

[portfolio]
max_invested_fraction = 1.0
risk_aversion = 8.0
uncertainty_penalty = 2.0
optimizer_iterations = 250
optimizer_step_size = 0.5
min_trade_usd = 10.0

[risk]
policy_version = "hard_risk_v1.1"
allow_margin = false
allow_options = false
allow_short_selling = false
allow_crypto = false
allow_leveraged_etfs = false
max_position_fraction = 1.00
max_positions = 10
max_trade_usd = 100000.00
max_trade_fraction = 1.00
max_daily_turnover_fraction = 1.00
max_portfolio_drawdown_fraction = 0.20
max_daily_loss_fraction = 0.08
max_live_orders_per_day = 10
max_spread_fraction = 0.003
max_execution_quote_age_seconds = 60

[execution]
max_decision_runs_per_day = 3
decision_windows = ["09:45", "13:00", "15:30"]
order_type = "market"
time_in_force = "gfd"
market_hours = "regular_hours"

[capital_plan]
target_value_usd = 100000.0
target_horizon_years = 5
planned_contributions_usd = [1000.0, 1000.0]
planned_contribution_months = [1, 2]
